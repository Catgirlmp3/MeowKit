name: Shell validation

on:
  push:
    branches: [main, meowkit-v2-restructure]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n meowkit.sh lib/*.sh commands/*.sh tests/*.sh
      - name: Test mining schedule boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash tests/schedule.sh
      - name: Check README formatting
        shell: bash
        run: |
          ! grep -Fq '\\n\\n' README.md
